services:
  musicjam-gateway:
    image: ghcr.io/fiit-talking-tom/musicjam-gateway:${IMAGE_TAG}

  musicjam-studio:
    image: ghcr.io/fiit-talking-tom/musicjam-studio:${IMAGE_TAG}

  musicjam-runtime:
    image: ghcr.io/fiit-talking-tom/musicjam-runtime:${IMAGE_TAG}
    environment:
      Environment__SslEnabled: true
      Environment__Domain: "test.musicjam.fun"

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "9090:9090"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - musicjam-gateway
      - grafana
      - prometheus

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

    grafana:
      environment:
        GF_SERVER_ROOT_URL: "https://test.musicjam.fun:3000/"

volumes:
  certbot_www:
  certbot_certs: