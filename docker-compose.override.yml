services:
  postgres:
    ports:
      - "5432:5432"

  musicjam-gateway:
    ports:
      - "5000:8080"

  prometheus:
    ports:
      - "9090:9090"
      
  grafana:
    ports:
      - "3000:3000"
      
  musicjam-runtime:
    environment:
      Environment__SslEnabled: false
      Environment__Domain: "localhost"
      Environment__Port: 5000