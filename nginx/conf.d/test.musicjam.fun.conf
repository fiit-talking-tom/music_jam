map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
    listen 80;
    server_name test.musicjam.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test.musicjam.fun;

    ssl_certificate     /etc/letsencrypt/live/test.musicjam.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.musicjam.fun/privkey.pem;

	client_max_body_size 200M;

    location / {
        proxy_pass http://musicjam-gateway:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 3000 ssl;
    server_name test.musicjam.fun;

    ssl_certificate     /etc/letsencrypt/live/test.musicjam.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.musicjam.fun/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 9090 ssl;
    server_name test.musicjam.fun;

    ssl_certificate     /etc/letsencrypt/live/test.musicjam.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.musicjam.fun/privkey.pem;

    auth_basic           "Prometheus";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $http_host;
    }
}

